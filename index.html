<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="СВЕМА ЛАБ — фотографическая лаборатория, конструктор и портфолио.">
  <title>СВЕМА ЛАБ — ИНДЕКС</title>
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <style>
    :root {
      --black: #000000;
      --black-soft: #0b0b0b;
      --charcoal: #141414;
      --paper: #e5e3dd;
      --white: #ffffff;
      --blue: #0a4aa8;
      --blue-light: #1557c8;
      --line-dark: #2e2e2e;
      --line-light: rgba(255, 255, 255, .32);
      --muted: #9ca1a8;
      --mono: Consolas, "Courier New", monospace;
      --display: Arial Black, Impact, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .index {
      width: 100%;
      height: 100dvh;
      min-height: 600px;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-template-rows: 72px repeat(10, minmax(0, 1fr)) 52px;
      overflow: hidden;
      background: var(--black);
    }

    .index::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, transparent calc(100% - 1px), var(--line-dark) calc(100% - 1px)),
        linear-gradient(to bottom, transparent calc(100% - 1px), var(--line-dark) calc(100% - 1px));
      background-size: calc(100% / 12) 100%, 100% calc(100% / 12);
      opacity: .38;
    }

    .identity {
      z-index: 2;
      grid-column: 1 / span 4;
      grid-row: 1;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 clamp(18px, 2.5vw, 36px);
      border-right: 1px solid var(--line-dark);
      border-bottom: 1px solid var(--line-dark);
      background: var(--black);
    }

    .identity__mark {
      position: relative;
      width: 37px;
      height: 39px;
      flex: 0 0 37px;
    }

    .identity__mark::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 12px;
      height: 38px;
      background: var(--blue);
    }

    .identity__mark::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 37px;
      height: 7px;
      background: var(--white);
    }

    .identity__mark i {
      position: absolute;
      top: 0;
      left: 22px;
      width: 2px;
      height: 28px;
      background: var(--white);
    }

    .identity__name {
      margin: 0;
      font: 900 16px / 1 var(--display);
      letter-spacing: .06em;
    }

    .identity__caption {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font: 9px var(--mono);
      letter-spacing: .13em;
    }

    .edition {
      z-index: 2;
      grid-column: 5 / span 5;
      grid-row: 1;
      display: flex;
      align-items: center;
      padding: 0 22px;
      border-right: 1px solid var(--line-dark);
      border-bottom: 1px solid var(--line-dark);
      background: var(--black);
      color: var(--muted);
      font: 10px var(--mono);
      letter-spacing: .11em;
    }

    .edition::before {
      content: "";
      width: 23px;
      height: 2px;
      margin-right: 11px;
      background: var(--blue);
    }

    .coordinates {
      z-index: 2;
      grid-column: 10 / -1;
      grid-row: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(18px, 2.5vw, 36px);
      border-bottom: 1px solid var(--line-dark);
      background: var(--black);
      color: var(--muted);
      font: 10px var(--mono);
      letter-spacing: .1em;
    }

    .coordinates__pulse {
      width: 9px;
      height: 9px;
      background: var(--blue);
      animation: pulse 2.6s ease-in-out infinite;
    }

    .hero-panel {
      z-index: 1;
      grid-column: 1 / span 7;
      grid-row: 2 / span 7;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(24px, 4.4vw, 70px);
      overflow: hidden;
      border-right: 1px solid var(--line-dark);
      border-bottom: 1px solid var(--line-dark);
      background: var(--black);
    }

    .hero-panel__index {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font: 10px var(--mono);
      letter-spacing: .16em;
    }

    .hero-panel__index::before {
      content: "";
      width: 44px;
      height: 8px;
      background: var(--blue);
    }

    .hero-panel__word {
      position: relative;
      z-index: 2;
      margin: 0;
      max-width: 800px;
      font: 900 clamp(80px, 12vw, 190px) / .72 var(--display);
      letter-spacing: -.085em;
      text-transform: uppercase;
    }

    .hero-panel__word span {
      display: block;
      margin-left: clamp(52px, 9vw, 140px);
      color: var(--paper);
    }

    .hero-panel__word em {
      color: var(--blue);
      font-style: normal;
    }

    .hero-panel__base {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 22px;
    }

    .hero-panel__modules {
      max-width: 410px;
      margin: 0;
      color: var(--muted);
      font: 10px / 1.7 var(--mono);
      letter-spacing: .08em;
    }

    .hero-panel__open {
      min-width: 230px;
      min-height: 70px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 0 23px;
      background: var(--white);
      color: var(--black);
      font: 700 12px var(--mono);
      letter-spacing: .06em;
      text-transform: uppercase;
      transition: background .2s, color .2s, transform .2s;
    }

    .hero-panel__open:hover {
      background: var(--blue);
      color: var(--white);
      transform: translateY(-4px);
    }

    .hero-panel__open b {
      font-size: 18px;
    }

    .hero-shape {
      position: absolute;
      pointer-events: none;
    }

    .hero-shape--one {
      right: -3%;
      top: 12%;
      width: 45%;
      height: 49%;
      border: 1px solid var(--line-light);
      animation: drift-one 9s ease-in-out infinite alternate;
    }

    .hero-shape--two {
      top: 21%;
      right: 11%;
      width: 34%;
      height: 13%;
      background: var(--blue);
      animation: drift-two 7s ease-in-out infinite alternate;
    }

    .hero-shape--three {
      right: 25%;
      bottom: -6%;
      width: 9%;
      height: 43%;
      background: var(--paper);
      opacity: .95;
      animation: rise 6s ease-in-out infinite alternate;
    }

    .hero-shape--four {
      top: 49%;
      right: 0;
      width: 54%;
      height: 1px;
      background: var(--line-light);
    }

    .project {
      z-index: 2;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--line-dark);
      transition: background .2s, color .2s;
    }

    .project::before {
      content: "";
      position: absolute;
      z-index: 0;
      width: 0;
      height: 100%;
      top: 0;
      left: 0;
      background: var(--blue);
      transition: width .34s cubic-bezier(.25, .8, .25, 1);
    }

    .project:hover::before {
      width: 100%;
    }

    .project__content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(18px, 2vw, 30px);
    }

    .project__label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: inherit;
      font: 10px var(--mono);
      letter-spacing: .12em;
    }

    .project__title {
      margin: 0;
      font: 900 clamp(34px, 4.2vw, 66px) / .78 var(--display);
      letter-spacing: -.065em;
      text-transform: uppercase;
    }

    .project__action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid currentColor;
      font: 700 10px var(--mono);
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .project__arrow {
      font-size: 21px;
      line-height: .8;
    }

    .project--constructor {
      grid-column: 8 / -1;
      grid-row: 2 / span 4;
      background: var(--paper);
      color: var(--black);
    }

    .project--lab {
      grid-column: 1 / span 7;
      grid-row: 2 / span 7;
      background: var(--black);
      color: var(--white);
    }

    .project--lab .project__content {
      padding: clamp(24px, 4.4vw, 70px);
    }

    .project--lab .project__title {
      max-width: 820px;
      font-size: clamp(72px, 10.7vw, 170px);
      letter-spacing: -.085em;
    }

    .project--lab .project__title span {
      display: block;
      margin-left: clamp(38px, 7vw, 110px);
      color: var(--paper);
    }

    .project--lab .project__action {
      max-width: 390px;
      min-height: 58px;
      padding: 0 17px;
      border: 0;
      background: var(--white);
      color: var(--black);
    }

    .project--lab:hover .project__action {
      background: var(--blue);
      color: var(--white);
    }

    .project__active {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--white);
    }

    .project__active i {
      width: 9px;
      height: 9px;
      background: var(--blue);
      animation: pulse 2.1s ease-in-out infinite;
    }

    .project--constructor::after {
      content: "";
      position: absolute;
      right: 16%;
      top: 16%;
      width: 30%;
      aspect-ratio: 1;
      border: 1px solid var(--black);
      box-shadow: 18px 18px 0 var(--blue);
      transition: transform .4s ease;
    }

    .project--constructor:hover::after {
      transform: translate(-13px, -13px);
    }

    .project--portfolio {
      grid-column: 8 / -1;
      grid-row: 6 / span 3;
      background: var(--blue);
      color: var(--white);
    }

    .project--portfolio::after {
      content: "";
      position: absolute;
      right: -3%;
      bottom: -38%;
      width: 58%;
      aspect-ratio: 1;
      border: 1px solid rgba(255,255,255,.74);
      transform: rotate(45deg);
      transition: transform .45s ease;
    }

    .project--portfolio:hover::after {
      transform: rotate(45deg) scale(1.24);
    }

    .project--portfolio .project__action {
      border-color: rgba(255,255,255,.8);
    }

    .project--portfolio:hover {
      color: var(--white);
    }

    .project--portfolio {
      cursor: default;
    }

    .project--portfolio:hover::before {
      width: 0;
    }

    .ticker {
      z-index: 2;
      grid-column: 1 / span 7;
      grid-row: 9 / span 3;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: stretch;
      min-height: 0;
      overflow: hidden;
      border-right: 1px solid var(--line-dark);
      background: var(--charcoal);
    }

    .ticker__head {
      display: flex;
      align-items: center;
      padding: 0 clamp(18px, 2.7vw, 38px);
      font: 700 clamp(28px, 4.4vw, 65px) / .84 var(--display);
      letter-spacing: -.055em;
      text-transform: uppercase;
    }

    .ticker__head span {
      color: var(--blue-light);
    }

    .ticker__rail {
      position: relative;
      width: clamp(70px, 10vw, 145px);
      overflow: hidden;
      border-left: 1px solid var(--line-dark);
    }

    .ticker__rail::before,
    .ticker__rail::after {
      content: "";
      position: absolute;
      left: 50%;
      width: 1px;
      background: var(--line-light);
      transform: translateX(-50%);
    }

    .ticker__rail::before {
      top: 0;
      bottom: 0;
    }

    .ticker__rail::after {
      top: 24%;
      width: 38px;
      height: 38px;
      background: var(--blue);
      transform: translateX(-50%) rotate(45deg);
      animation: slide 5s ease-in-out infinite alternate;
    }

    .specimen {
      z-index: 2;
      grid-column: 8 / -1;
      grid-row: 9 / span 3;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid var(--line-dark);
      background: var(--black-soft);
    }

    .specimen__cell {
      position: relative;
      overflow: hidden;
      border-right: 1px solid var(--line-dark);
    }

    .specimen__cell:last-child {
      border-right: 0;
    }

    .specimen__cell::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 24px;
      height: 24px;
      background: var(--paper);
      transform: translate(-50%, -50%);
    }

    .specimen__cell:nth-child(2)::before {
      width: 16px;
      height: 65%;
      background: var(--blue);
    }

    .specimen__cell:nth-child(3)::before {
      width: 65%;
      height: 16px;
      background: var(--white);
    }

    .specimen__cell:nth-child(4)::before {
      width: 48px;
      height: 48px;
      border: 1px solid var(--paper);
      background: transparent;
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .specimen__cell:hover::before {
      animation: specimen-move .7s cubic-bezier(.2,.8,.2,1) both;
    }

    .footer {
      z-index: 3;
      grid-column: 1 / -1;
      grid-row: 12;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(18px, 2.5vw, 36px);
      background: var(--black);
      border-top: 1px solid var(--line-dark);
      color: var(--muted);
      font: 9px var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .footer__key {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer__key i {
      width: 8px;
      height: 8px;
      background: var(--blue);
    }

    @keyframes pulse {
      50% {
        transform: scale(.45);
        opacity: .55;
      }
    }

    @keyframes drift-one {
      100% {
        transform: translate(-8%, 6%);
      }
    }

    @keyframes drift-two {
      100% {
        transform: translate(-23%, 18%);
      }
    }

    @keyframes rise {
      100% {
        transform: translateY(-45px);
      }
    }

    @keyframes slide {
      100% {
        top: 62%;
        transform: translateX(-50%) rotate(225deg);
      }
    }

    @keyframes specimen-move {
      0% {
        transform: translate(-50%, -50%);
      }

      45% {
        transform: translate(-50%, -80%) rotate(90deg) scale(1.2);
      }

      100% {
        transform: translate(-50%, -50%);
      }
    }

    @media (max-width: 850px) {
      .index {
        grid-template-rows: 62px repeat(10, minmax(0, 1fr)) 42px;
      }

      .identity__caption {
        display: none;
      }

      .identity {
        gap: 11px;
      }

      .identity__name {
        font-size: 13px;
      }

      .edition,
      .coordinates {
        font-size: 8px;
      }

      .hero-panel {
        padding: clamp(22px, 3.7vw, 38px);
      }

      .hero-panel__base {
        align-items: flex-start;
        flex-direction: column;
        gap: 15px;
      }

      .hero-panel__open {
        min-height: 41px;
      }
    }

    @media (max-width: 680px) {
      .index {
        min-height: 520px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: 50px repeat(10, minmax(0, 1fr)) 36px;
      }

      .index::before {
        background-size: 25% 100%, 100% calc(100% / 12);
      }

      .identity {
        grid-column: 1 / span 2;
        padding: 0 13px;
        border-right: 1px solid var(--line-dark);
      }

      .identity__mark {
        width: 29px;
        height: 31px;
        transform: scale(.73);
        transform-origin: left center;
        margin-right: -8px;
      }

      .identity__name {
        font-size: 11px;
      }

      .edition {
        grid-column: 3 / -1;
        padding: 0 13px;
        border-right: 0;
        font-size: 7px;
      }

      .edition::before {
        width: 15px;
        margin-right: 7px;
      }

      .coordinates {
        display: none;
      }

      .hero-panel {
        grid-column: 1 / -1;
        grid-row: 2 / span 5;
        padding: 20px 16px;
        border-right: 0;
      }

      .hero-panel__index {
        font-size: 8px;
      }

      .hero-panel__index::before {
        width: 28px;
        height: 6px;
      }

      .hero-panel__word {
        font-size: clamp(62px, 21vw, 112px);
      }

      .hero-panel__word span {
        margin-left: 19vw;
      }

      .hero-panel__modules {
        max-width: 250px;
        font-size: 7px;
        line-height: 1.55;
      }

      .hero-panel__open {
        min-width: 158px;
        min-height: 43px;
        gap: 11px;
        padding: 0 13px;
        font-size: 8px;
      }

      .hero-panel__open b {
        font-size: 14px;
      }

      .hero-shape--one {
        top: 18%;
      }

      .hero-shape--two {
        width: 40%;
        height: 11%;
      }

      .project__content {
        padding: 12px;
      }

      .project__label,
      .project__action {
        font-size: 7px;
      }

      .project__title {
        font-size: clamp(26px, 9vw, 45px);
      }

      .project__arrow {
        font-size: 15px;
      }

      .project--constructor {
        grid-column: 1 / span 2;
        grid-row: 7 / span 3;
      }

      .project--lab {
        grid-column: 1 / -1;
        grid-row: 2 / span 5;
      }

      .project--lab .project__content {
        padding: 20px 16px;
      }

      .project--lab .project__title {
        font-size: clamp(51px, 16.5vw, 92px);
      }

      .project--lab .project__title span {
        margin-left: 14vw;
      }

      .project--lab .project__action {
        min-height: 42px;
        max-width: 250px;
        padding: 0 11px;
      }

      .project--constructor::after {
        right: 13%;
        top: 18%;
        box-shadow: 9px 9px 0 var(--blue);
      }

      .project--portfolio {
        grid-column: 3 / -1;
        grid-row: 7 / span 3;
      }

      .ticker {
        grid-column: 1 / span 3;
        grid-row: 10 / span 2;
        border-right: 1px solid var(--line-dark);
      }

      .ticker__head {
        padding: 0 12px;
        font-size: 31px;
      }

      .ticker__rail {
        width: 38px;
      }

      .ticker__rail::after {
        width: 20px;
        height: 20px;
      }

      .specimen {
        grid-column: 4 / -1;
        grid-row: 10 / span 2;
        grid-template-columns: 1fr 1fr;
      }

      .specimen__cell:nth-child(2) {
        border-right: 0;
      }

      .specimen__cell:nth-child(-n+2) {
        border-bottom: 1px solid var(--line-dark);
      }

      .footer {
        grid-row: 12;
        padding: 0 12px;
        font-size: 7px;
      }

      .footer__key {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="index">
    <header class="identity">
      <span class="identity__mark" aria-hidden="true"><i></i></span>
      <p class="identity__name">СВЕМА ЛАБ<span class="identity__caption">ФОТО · ВИДЕО · ЭКСПЕРИМЕНТЫ</span></p>
    </header>

    <p class="edition">Т.О ПАНТОНА / 2026</p>

    <div class="coordinates">
      <span>КИЕВ / УКРАИНА</span>
      <i class="coordinates__pulse" aria-hidden="true"></i>
    </div>

    <a class="project project--lab" href="СВЕМА ЛАБ.html" aria-label="Открыть фотолабу СВЕМА ЛАБ">
      <span class="hero-shape hero-shape--one" aria-hidden="true"></span>
      <span class="hero-shape hero-shape--two" aria-hidden="true"></span>
      <span class="hero-shape hero-shape--three" aria-hidden="true"></span>
      <span class="hero-shape hero-shape--four" aria-hidden="true"></span>
      <div class="project__content">
        <div class="project__label"><span class="project__active"><i></i> НАЖМИТЕ, ЧТОБЫ ОТКРЫТЬ</span><span>01</span></div>
        <h1 class="project__title">СВЕМА <span>ЛАБ</span></h1>
        <div class="project__action"><span>ОТКРЫТЬ СВЕМУ ЛАБ</span><span class="project__arrow">↗</span></div>
      </div>
    </a>

    <a class="project project--constructor" id="constructor" href="КОНСТРУКТОР%20%E2%80%94%20%D0%BA%D0%B0%D1%80%D1%83%D1%81%D0%B5%D0%BB%D1%8C.html">
      <div class="project__content">
        <div class="project__label"><span>02 / МАКЕТЫ</span><span>СТУДИЯ</span></div>
        <h2 class="project__title">СВЕМА<br>КОНСТРУКТОР</h2>
        <div class="project__action"><span>ОТКРЫТЬ</span><span class="project__arrow">↗</span></div>
      </div>
