<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>СВЕМА LAB — Конструктор карусели</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Anton&family=Barlow+Condensed:wght@400;700&family=Bebas+Neue&family=Cormorant+Garamond:wght@400;700&family=DM+Sans:wght@400;700&family=IBM+Plex+Mono:wght@400;700&family=Lora:wght@400;700&family=Manrope:wght@400;700&family=Montserrat:wght@400;700&family=Oswald:wght@400;700&family=Playfair+Display:wght@400;700&family=PT+Serif:wght@400;700&family=Roboto+Condensed:wght@400;700&family=Russo+One&family=Space+Grotesk:wght@400;700&display=swap">
<style>
:root{--bg:#000;--pn:#0b0b0b;--surface:#141414;--field:#161616;--ink:#fff;--muted:#9ca1a8;--line:#2e2e2e;--line-strong:#4e4e4e;--ac:#1557c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}

body{background:var(--bg);color:var(--ink);font:13px/1.45 "Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"t t" "s r";overflow:hidden}
header{grid-area:t;background:var(--bg);border-bottom:1px solid var(--line-strong);box-shadow:inset 0 2px #fff;display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;align-items:center;z-index:2}

:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

.sp{flex:1}
#st{grid-area:s;position:relative;overflow:auto;display:flex;padding:20px;background:#050505;touch-action:none;overscroll-behavior:contain}
#st.drop-active{background:#07101d}#st.drop-active #wr{box-shadow:0 0 0 2px var(--ac),0 12px 32px rgba(0,0,0,.5)}#st.drop-active:after{content:"ОТПУСТИТЕ, ЧТОБЫ ДОБАВИТЬ ФОТО";position:absolute;inset:20px;z-index:10;display:grid;place-items:center;border:1px dashed var(--ac);background:rgba(7,15,27,.72);color:#fff;font:700 13px "IBM Plex Mono",monospace;letter-spacing:.08em;text-align:center;pointer-events:none}#st.drop-slot:after{content:"ЗАПОЛНИТЬ МЕСТО ДЛЯ ФОТО"}
#wr{position:relative;margin:auto;flex:none;border:1px solid var(--line-strong);box-shadow:0 12px 32px rgba(0,0,0,.5)}
#pc{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.sb{position:absolute;top:0;height:100%}
.sd{position:absolute;top:0;height:100%;border-left:calc(1px*var(--k)) dashed var(--ac);pointer-events:none}
.sd b{position:absolute;left:calc(8*var(--k));top:calc(8*var(--k));font:700 calc(18*var(--k)) "IBM Plex Mono",monospace;background:var(--ac);color:#fff;padding:0 calc(6*var(--k))}
.l{position:absolute;overflow:hidden;white-space:pre-wrap;cursor:move;user-select:none}
.l.on{overflow:visible;outline:calc(2*var(--k)) solid var(--ac)}
.h{position:absolute;right:calc(-8*var(--k));bottom:calc(-8*var(--k));width:calc(18*var(--k));height:calc(18*var(--k));background:var(--ac);border:1px solid #fff;cursor:nwse-resize}
.l.slot{display:flex;align-items:center;justify-content:center;white-space:pre-line;text-align:center;background:#deded9;border:calc(2px*var(--k)) dashed #777;color:#666;font:700 calc(28px*var(--k))/1.5 "IBM Plex Mono",monospace;cursor:pointer}.si{position:absolute;z-index:4;transform:translate(-50%,-50%);width:calc(72px*var(--k));height:calc(88px*var(--k));padding:0;border:0;background:transparent;color:#fff;font-size:0;display:grid;place-items:center}.si:after{content:"+";display:grid;place-items:center;width:calc(54px*var(--k));height:calc(54px*var(--k));border-radius:50%;background:var(--ac);border:calc(3px*var(--k)) solid #fff;font:700 calc(38px*var(--k))/1 "Segoe UI",sans-serif;box-shadow:0 4px 14px #0009}.si:hover:after{background:#fff;color:var(--ac)}
#rp{grid-area:r;background:var(--pn);border-left:1px solid var(--line-strong);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
#rp h2{font:700 13px "Segoe UI",sans-serif;letter-spacing:.06em;text-transform:uppercase;margin:0;padding:4px 0 8px 10px;border-bottom:1px solid var(--line);box-shadow:inset 3px 0 var(--ac)}
#rp p{color:var(--muted);font-size:12px;line-height:1.55;margin:2px 0}
#rp label{display:flex;flex-direction:column;gap:5px;color:#d8d8d8;font-size:12px}
.layer-list{display:flex;flex-direction:column;gap:5px}.layer-row{display:flex;gap:5px}.layer-row button[data-select-layer]{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.layer-row button[data-hide-layer],.layer-row button[data-delete-layer]{width:38px;padding:5px}.layer-row button[data-delete-layer]{color:#ff8585;border-color:#633838}.layer-row.active button[data-select-layer]{border-color:var(--ac);box-shadow:inset 2px 0 var(--ac)}.template-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.template-grid button{min-height:52px;text-align:left}.template-grid small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.slide-colors{border:1px solid var(--line-strong);padding:8px}.slide-colors summary{cursor:pointer;color:#d8d8d8;font:700 11px "IBM Plex Mono",monospace;letter-spacing:.04em}.color-list{display:grid;gap:5px;padding-top:9px}.swatch-row{flex-direction:row!important;align-items:center;justify-content:space-between;background:#111;padding:4px 7px}.swatch-row input[type=color]{width:54px;height:30px}
.template-art{height:150px!important;position:relative;display:flex!important;flex-direction:column;justify-content:flex-end!important;padding:10px!important;font-size:15px!important;letter-spacing:.02em!important;overflow:hidden}.template-art small{position:absolute;z-index:2;left:10px;top:8px;font:9px "IBM Plex Mono",monospace!important;letter-spacing:.04em}.template-art>b{position:relative;z-index:2;display:block;max-width:76%;font:800 15px/1 "Space Grotesk",sans-serif;letter-spacing:.02em}.template-art>em{position:relative;z-index:2;display:block;margin-top:5px;font:9px "IBM Plex Mono",monospace;letter-spacing:.04em;opacity:.72;font-style:normal}.template-art:before{content:"";position:absolute;z-index:1;left:7%;top:26%;width:86%;height:56%;border:1px solid #7778;background:linear-gradient(145deg,#a6a7a3 0%,#deded9 44%,#8f918d 100%)}.template-art:after{content:"";position:absolute;left:0;right:0;bottom:0;height:19%;background:linear-gradient(90deg,transparent,#00000012)}.template-art.layout-cinema:before{left:3%;top:15%;width:94%;height:76%;background:linear-gradient(145deg,#434448,#77736d 55%,#36373a)}.template-art.layout-cinema:after{height:24%;background:#17181b}.template-art.layout-botanical:before{left:30%;top:22%;width:64%;height:67%;background:linear-gradient(145deg,#859184,#c0c7ba 55%,#7f897a)}.template-art.layout-riso:before{left:5%;top:21%;width:57%;height:69%;background:linear-gradient(145deg,#aaa69e,#d7d3cc 55%,#9d9992)}.template-art.layout-archive:before{left:17%;top:23%;width:66%;height:62%;border:7px solid #eeeae1;background:linear-gradient(145deg,#aaa9a2,#d8d6d0 55%,#95948e)}.template-art.layout-electric:before{left:17%;top:24%;width:66%;height:66%;background:linear-gradient(145deg,#313238,#5a5b5e 55%,#28292e)}
.template-art.layout-constructivist:before{left:39%;top:17%;width:55%;height:72%;background:linear-gradient(145deg,#a4a39e,#dad8d0 55%,#93928d)}.template-art.layout-constructivist:after{left:7%;right:auto;bottom:46%;width:52%;height:6%;background:var(--accent);transform:rotate(-12deg)}.template-art.layout-bauhaus:before{left:5%;top:19%;width:58%;height:68%;background:linear-gradient(145deg,#a8a7a1,#d9d7d0 55%,#999791)}.template-art.layout-bauhaus:after{left:72%;right:auto;bottom:28%;width:22%;height:24%;border-radius:50%;background:var(--accent)}.template-art.layout-modular:before{left:5%;top:20%;width:58%;height:67%;background:linear-gradient(145deg,#aaa9a3,#deddd7 55%,#93938f)}.template-art.layout-modular:after{left:70%;right:7%;bottom:31%;height:4px;background:var(--accent)}.template-open{width:100%;min-height:46px!important;border-color:var(--ac);color:#fff}.danger{color:#ff7777!important;border-color:#6e3838!important}.modal-backdrop{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:16px;backdrop-filter:blur(5px)}.modal{width:min(760px,100%);max-height:min(86vh,820px);overflow:auto;background:#0b0b0b;border:1px solid #555;box-shadow:0 18px 70px #000;padding:20px;display:flex;flex-direction:column;gap:14px}.modal-head{display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid #333;padding-bottom:12px}.modal-head h2{margin:0;font-size:16px;letter-spacing:.08em}.modal-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.modal-x{min-width:38px;font-size:18px}.template-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.template-card{padding:0!important;text-align:left;overflow:hidden;background:#121212}.template-art{height:105px;display:flex;flex-direction:column;justify-content:space-between;padding:12px;color:var(--ink);font-weight:800;font-size:19px;letter-spacing:.06em}.template-art small{font:10px "IBM Plex Mono",monospace;letter-spacing:.05em}.template-meta{display:block;padding:10px;color:#fff}.template-meta small{display:block;color:var(--muted);margin-top:4px;font-size:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid #333;padding-top:12px}.modal-actions .primary{background:#1557c8;border-color:#1557c8}.confirm-preview{padding:18px;border:1px solid #444;display:flex;gap:12px;align-items:center}.confirm-swatch{width:68px;height:82px;flex:0 0 auto;border:1px solid #666}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r{display:flex;gap:6px;flex-wrap:wrap}
.r button{flex:1 1 auto}
input[type=color]{width:100%;height:36px;padding:2px;border:1px solid var(--line-strong);border-radius:2px;background:var(--field)}
textarea{resize:vertical;min-height:88px}
#fm,#ef{width:auto;min-width:76px}
@media(max-width:900px){body{grid-template-columns:minmax(0,1fr) 270px}#rp{padding:12px}}
@media(max-width:900px) and (min-width:761px){header{gap:8px}.toolbar{flex:1 1 100%;order:2;overflow-x:auto;white-space:nowrap}.sp{display:none}}
@media(max-width:760px){body{height:auto;min-height:100%;display:flex;flex-direction:column;overflow:auto}header{position:sticky;top:0;display:block;padding:8px;overflow:hidden}header h1{width:100%;margin:0 0 7px}.toolbar{overflow-x:auto;overflow-y:hidden;gap:5px;padding:2px 2px 6px;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}.toolbar>*{flex:0 0 auto}.toolbar .sp{display:none}#st{min-height:68vh;flex:1 0 68vh;padding:14px;overflow:auto}#rp{border:0;border-top:1px solid var(--line-strong);overflow:visible;padding:14px 12px 24px;gap:10px}.g{gap:7px}button{min-height:40px}}
@media(max-width:520px){.template-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.modal{padding:14px}.template-art{height:112px!important}.confirm-preview{align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header>
<h1>СВЕМА LAB <small>КОНСТРУКТОР КАРУСЕЛИ</small></h1>
<div class="toolbar">
<select id="fm" style="width:auto" aria-label="Формат слайда"><option>4:5</option><option>9:16</option><option>1:1</option><option>3:4</option><option>2:3</option><option>3:2</option><option>4:3</option><option>16:9</option><option>A5</option><option>A4</option></select>
<button data-a="slAdd" title="Добавить слайд в конец">+ Слайд</button><button data-a="slInsert" title="Вставить после текущего слайда">+ Рядом</button><button data-a="slDel" title="Удалить последний слайд">− Слайд</button>
<button data-a="templates">✦ Шаблоны</button><button data-a="addText">+ Текст</button><button data-a="addImg">+ Фото</button><button data-a="addRect">+ Плашка</button><button data-a="addCircle">+ Круг</button><button data-a="addLine">+ Линия</button><button data-a="copy" title="Копировать выбранный слой (Ctrl+C)">Копировать</button><button data-a="paste" title="Вставить слой (Ctrl+V)">Вставить</button><button data-a="reset" class="danger">Сбросить проект</button>
<button data-a="undo" title="Отменить (Ctrl+Z)" aria-label="Отменить">↶</button><button data-a="redo" title="Повторить (Ctrl+Y)" aria-label="Повторить">↷</button>
<span class="sp"></span>
<select id="ef" aria-label="Формат экспорта"><option value="png">PNG · ZIP</option><option value="jpg">JPEG · ZIP</option><option value="pdf">PDF</option></select><button data-a="png">Экспорт</button><button data-a="save">Сохранить проект</button><button data-a="load">Открыть проект</button>
<input type="file" id="fi" accept="image/*" multiple hidden><input type="file" id="fj" accept=".json" hidden>
</div>
</header>
<main id="st"><div id="wr"><div id="pc"></div></div></main>
<aside id="rp"></aside>
<script>
const FM={'4:5':1350,'9:16':1920,'1:1':1080,'3:4':1440,'2:3':1620,'3:2':720,'4:3':810,'16:9':608,'A5':1527,'A4':3054},W=1080,FONTS=['Russo One','Oswald','Anton','Bebas Neue','Archivo Black','Barlow Condensed','Montserrat','Manrope','DM Sans','Space Grotesk','Roboto Condensed','Playfair Display','Cormorant Garamond','Lora','PT Serif','IBM Plex Mono','Arial'],BG='#f1f1ef';
let S={fmt:'4:5',n:3,bg:[BG,BG,BG],L:[]},A={},sel=null,sc=1,hist=[],hi=-1,k=1,D=null,tm,clip=null,viewFrame=0;
const $=s=>document.querySelector(s),H=()=>FM[S.fmt],ly=()=>S.L.find(l=>l.id===sel),nid=()=>'i'+Date.now().toString(36)+k++;
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('konstruktor',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const dbSet=async v=>{try{(await idb()).transaction('k','readwrite').objectStore('k').put(v,'c')}catch(e){}};
const dbGet=async()=>{try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('k').objectStore('k').get('c');q.onsuccess=()=>ok(q.result);q.onerror=()=>ok()})}catch(e){}};
function persist(){clearTimeout(tm);tm=setTimeout(()=>dbSet({S,A}),500)}
function push(){hist=hist.slice(0,hi+1);hist.push(JSON.stringify(S));hi=hist.length-1;persist()}
function fit(){const b=$('#st'),h=(b.clientHeight-40)/H(),w=(b.clientWidth-40)/(S.n*W);sc=Math.max(.05,Math.max(Math.min(h,w),h*.6))}
function visibleRange(){const a=$('#st').getBoundingClientRect(),b=$('#wr').getBoundingClientRect(),pad=W;return{left:Math.max(0,(a.left-b.left)/sc-pad),right:Math.min(S.n*W,(a.right-b.left)/sc+pad)}}
function paintLayer(e,l){e.className='l'+(l.id===sel?' on':'')+(l.t==='slot'?' slot':'');e.dataset.id=l.id;e.style.cssText=`left:${l.x}px;top:${l.y}px;width:${l.w}px;height:${l.h}px;transform:rotate(${l.r}deg);opacity:${l.o}`;
if(l.t==='slot'){e.textContent='＋\nМЕСТО ДЛЯ ФОТО';e.style.background=l.col||'#deded9';e.style.borderColor=l.stroke||'#777';e.style.color=l.labelColor||'#666'}else if(l.t==='text'){e.textContent=l.txt;e.style.font=`${l.fs}px/1.2 "${l.ff}"`;e.style.color=l.col;e.style.textAlign=l.ta}
else if(l.t==='rect'||l.t==='line')e.style.background=l.col;else if(l.t==='circle'){e.style.background=l.col;e.style.borderRadius='50%'}else{const fit=l.fit||'cover';e.style.backgroundColor='#111';e.style.backgroundImage=`url("${A[l.a]}")`;e.style.backgroundPosition='center';e.style.backgroundRepeat='no-repeat';e.style.backgroundSize=fit==='stretch'?'100% 100%':fit}
if(l.id===sel)e.insertAdjacentHTML('beforeend','<i class="h"></i>')}
function patchLayer(l){const e=$(`[data-id="${l.id}"]`);if(e)paintLayer(e,l)}
function draw(){fit();const w=$('#wr'),p=$('#pc'),T=S.n*W;w.style.width=T*sc+'px';w.style.height=H()*sc+'px';const range=visibleRange();
p.style.cssText=`width:${T}px;height:${H()}px;transform:scale(${sc});--k:${1/sc}px`;p.innerHTML='';
for(let i=0;i<S.n;i++)p.insertAdjacentHTML('beforeend',`<div class="sb" data-slide="${i}" style="left:${i*W}px;width:${W}px;background:${S.bg[i]}"></div>`);
S.L.forEach(l=>{if(l.hidden||l.x+l.w<range.left||l.x>range.right)return;const e=document.createElement('div');paintLayer(e,l);p.appendChild(e)});
for(let i=0;i<S.n;i++){p.insertAdjacentHTML('beforeend',`<div class="sd" style="left:${i*W}px"><b>${i+1}</b></div>`);if(i>0)p.insertAdjacentHTML('beforeend',`<button class="si" data-insert-at="${i}" style="left:${i*W}px;top:${H()/2}px" title="Вставить слайд здесь">Вставить слайд ${i+1}</button>`)}$('#fm').value=S.fmt}
function layerList(){return `<h2>Слои · ${S.L.length}</h2><div class="layer-list">${[...S.L].reverse().map((x,j)=>`<div class="layer-row${x.id===sel?' active':''}"><button data-select-layer="${x.id}">${S.L.length-j}. ${{text:'Текст',rect:'Плашка',img:'Фото',slot:'Место для фото',circle:'Круг',line:'Линия'}[x.t]||'Слой'}${x.hidden?' · скрыт':''}</button><button data-hide-layer="${x.id}" title="Показать или скрыть">${x.hidden?'○':'◉'}</button><button data-delete-layer="${x.id}" title="Удалить этот слой" aria-label="Удалить слой">×</button></div>`).join('')||'<p>Добавь текст, фото или фигуру — здесь появятся слои.</p>'}</div>`}
function slideColors(){return `<details class="slide-colors"><summary>ЦВЕТ ФОНА · ${S.n} СЛАЙДОВ</summary><div class="color-list">${S.bg.map((c,i)=>`<label class="swatch-row"><span>Слайд ${String(i+1).padStart(2,'0')}</span><input type="color" data-s="${i}" value="${c}"></label>`).join('')}</div></details>`}
function panel(){const l=ly(),r=$('#rp');
if(!l){r.innerHTML=`<h2>Слайды: ${S.n}</h2>${slideColors()}<button class="template-open" data-a="templates">✦ ОТКРЫТЬ ГАЛЕРЕЮ ШАБЛОНОВ</button>${layerList()}<p>Нажми «+» между слайдами, чтобы вставить новый в нужное место. Слои можно перемещать между слайдами.</p>`;return}
const f=(q,t)=>`<label>${t}<input type="number" data-k="${q}" value="${Math.round(l[q])}"></label>`;
