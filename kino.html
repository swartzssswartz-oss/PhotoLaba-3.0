<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>КИНО — Т.О 37.ЛАБ</title>
<style>
:root{--paper:#e5e3dd;--blue:#0a4aa8;--blue2:#1557c8;--line:#2e2e2e;--muted:#9ca1a8;--mono:Consolas,"Courier New",monospace;--disp:"Arial Black",Impact,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button,input,select{font:inherit;color:inherit;border-radius:0}
::selection{background:var(--blue);color:#fff}:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}
body{min-height:100vh;display:flex;flex-direction:column;background-image:linear-gradient(to right,transparent calc(100% - 1px),#161616 0);background-size:calc(100%/12) 100%}
header{position:sticky;top:0;z-index:30;display:flex;height:64px;background:#000;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:0 24px;border-right:1px solid var(--line);font:900 15px var(--disp);letter-spacing:.06em;white-space:nowrap}
.mark{position:relative;width:26px;height:28px;flex:none}.mark:before{content:"";position:absolute;left:0;top:0;width:9px;height:27px;background:var(--blue)}.mark:after{content:"";position:absolute;left:0;bottom:0;width:26px;height:5px;background:#fff}
nav{display:flex;flex:1;overflow-x:auto;scrollbar-width:none}
nav a{display:flex;align-items:center;padding:0 22px;border-right:1px solid var(--line);font:10px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
nav a:hover{color:#fff;background:#0e0e0e}nav a.on{background:var(--paper);color:#000;font-weight:700;box-shadow:inset 0 -4px 0 var(--blue)}
nav .r{margin-left:auto;border-right:0;border-left:1px solid var(--line)}
main{flex:1}
.hero{position:relative;padding:clamp(28px,6vw,80px) clamp(16px,3vw,48px) clamp(26px,4vw,56px);border-bottom:1px solid var(--line);overflow:hidden}
.hero:before{content:"";position:absolute;right:0;top:clamp(40px,9vw,130px);width:42%;height:clamp(40px,8vw,120px);background:var(--blue)}
.hero h1{position:relative;margin:0;font:900 clamp(80px,22vw,330px)/.8 var(--disp);letter-spacing:-.08em;text-transform:uppercase}
.hero p{position:relative;max-width:520px;margin:clamp(22px,3vw,38px) 0 24px;color:var(--muted);font-size:15px;line-height:1.55}
.btn{display:inline-flex;align-items:center;justify-content:space-between;gap:18px;min-height:46px;padding:0 22px;border:1px solid #fff;background:#fff;color:#000;font:700 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.btn:hover:not(:disabled){background:var(--blue2);border-color:var(--blue2);color:#fff}.btn:disabled{opacity:.4;cursor:wait}
.btn.big{min-height:64px;padding:0 28px;font-size:12px;min-width:min(100%,360px)}
.btn.gh{background:transparent;color:#fff;border-color:#4a4a4a;font-weight:400}.btn.gh:hover:not(:disabled){background:#0e0e0e;border-color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.rec .rh{padding:16px clamp(16px,3vw,48px);border-bottom:1px solid var(--line)}.rec .rh a:hover{color:var(--blue2)}
.sec{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding:clamp(24px,4vw,56px) clamp(16px,3vw,48px) 20px;border-bottom:1px solid var(--line)}
.sec h1{margin:0;font:900 clamp(40px,9vw,124px)/.82 var(--disp);letter-spacing:-.07em;text-transform:uppercase;background:linear-gradient(var(--blue),var(--blue)) no-repeat 38% 62%/36% 28%}
.sec small{display:block;margin-bottom:10px;color:var(--muted);font:10px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.srch{padding:0 clamp(16px,3vw,48px);border-bottom:1px solid var(--line)}
.srch input{display:block;width:100%;padding:16px 0;background:none;border:0;color:#fff;font:12px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.srch input:focus{outline:0;box-shadow:inset 0 -3px 0 var(--blue2)}.srch input::placeholder{color:#6e7378}
.chips{display:flex;flex-wrap:wrap;padding:0 clamp(16px,3vw,48px);border-bottom:1px solid var(--line)}
.chip{padding:13px 16px;border:0;border-right:1px solid var(--line);background:none;font:10px var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;cursor:pointer}
.chip:first-child{border-left:1px solid var(--line)}.chip:hover{color:#fff}.chip.on{background:#fff;color:#000;font-weight:700;box-shadow:inset 0 -3px 0 var(--blue)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(46%,200px),1fr));border-bottom:1px solid var(--line)}
.fc{position:relative;display:block;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#0b0b0b;overflow:hidden}
.pw{display:block;aspect-ratio:2/3;background:#0b0b0b}.pw img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.fc:hover img{transform:scale(1.04)}
.np{display:flex;align-items:center;justify-content:center;height:100%;padding:16px;background:var(--blue);font:900 20px/.95 var(--disp);letter-spacing:-.04em;text-transform:uppercase;text-align:center}
.fc .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.9));font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.fc .cap b{display:block;margin-bottom:4px;font:900 14px/1.1 var(--disp);letter-spacing:-.01em}
.rt{display:inline-flex;align-items:center;gap:3px;font:700 11px var(--mono)}.rt i{width:12px;height:12px;background:#2a2a2a}.rt i.on{background:var(--blue2)}.rt b{margin-left:9px}
.film{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:clamp(24px,4vw,64px);padding:clamp(24px,4vw,56px) clamp(16px,3vw,48px) 80px;align-items:start}
.film .poster{position:sticky;top:90px}.film .poster img,.film .poster .np{display:block;width:100%;aspect-ratio:2/3;box-shadow:16px 16px 0 var(--blue)}
.film h1{margin:14px 0 12px;font:900 clamp(36px,6.4vw,86px)/.88 var(--disp);letter-spacing:-.065em;text-transform:uppercase;overflow-wrap:anywhere}
.meta{font:10px/1.8 var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.lbl{display:flex;align-items:center;gap:10px;margin:34px 0 14px;font:10px var(--mono);letter-spacing:.16em;text-transform:uppercase}
.lbl:before{content:"";width:22px;height:5px;background:var(--blue)}
.rev p{margin:0 0 1.2em;font-size:18px;line-height:1.65;max-width:68ch}
.rev h2{margin:1.6em 0 .6em;font:900 22px/1 var(--disp);letter-spacing:-.03em;text-transform:uppercase;padding-left:14px;border-left:6px solid var(--blue)}
.about{color:#c4c7cc;font-size:15px;line-height:1.6;max-width:68ch}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.lnk{display:inline-block;padding:8px 0;border-bottom:1px solid var(--line);font:10px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}.lnk:hover{color:#fff;border-color:var(--blue2)}
.ctl{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;padding:22px clamp(16px,3vw,48px);border-bottom:1px solid var(--line)}
.seg{display:inline-flex}.seg button{padding:13px 16px;border:1px solid #4a4a4a;margin-right:-1px;background:none;font:10px var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase;cursor:pointer}
.seg button:hover:not(:disabled){color:#fff}.seg button.on{background:#fff;color:#000;border-color:#fff;font-weight:700}.seg button:disabled{opacity:.35;cursor:not-allowed}
.flt{display:flex;flex-wrap:wrap;gap:10px}
select{padding:12px 12px;background:#0b0b0b;border:1px solid #4a4a4a;font:11px var(--mono);letter-spacing:.06em;color:#fff}
select:focus{outline:0;border-color:var(--blue2)}
.pick{animation:in .5s cubic-bezier(.2,.8,.2,1)}@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.note{margin:0;padding:18px clamp(16px,3vw,48px);border-bottom:1px solid var(--line);color:var(--muted);font:12px/1.65 var(--mono)}
.empty{padding:clamp(40px,8vw,110px) clamp(16px,3vw,48px);border-bottom:1px solid var(--line)}.empty h2{margin:0 0 14px;font:900 clamp(28px,5vw,64px)/.9 var(--disp);letter-spacing:-.06em;text-transform:uppercase}.empty p{max-width:460px;margin:0;color:var(--muted);line-height:1.55}
footer{padding:16px clamp(16px,3vw,48px);border-top:1px solid var(--line);color:#6e7378;font:9px/1.7 var(--mono);letter-spacing:.1em;text-transform:uppercase}
footer a{border-bottom:1px solid #4a4a4a}footer a:hover{color:#fff}
@media(max-width:820px){header{height:56px}.brand{padding:0 14px}.brand b{display:none}nav a{padding:0 14px}.film{grid-template-columns:1fr}.film .poster{position:static;max-width:300px}.hero:before{width:55%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><a class="brand" href="#/"><i class="mark"></i><b>КИНО</b></a>
 <nav><a href="#/reviews" data-r="reviews">Обзоры</a><a href="#/random" data-r="random">Что посмотреть</a><a class="r" href="to37lab.html">Т.О 37.ЛАБ ↗</a></nav></header>
<main id="app"></main>
<footer>Данные о фильмах и постеры — <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>. Этот сайт использует API TMDB, но не одобрен и не сертифицирован TMDB.</footer>

<script>
const $=(s,r=document)=>r.querySelector(s),esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IMG='https://image.tmdb.org/t/p/',GEN={28:'боевик',12:'приключения',16:'мультфильм',35:'комедия',80:'криминал',99:'документальный',18:'драма',10751:'семейный',14:'фэнтези',36:'история',27:'ужасы',10402:'музыка',9648:'детектив',10749:'мелодрама',878:'фантастика',53:'триллер',10752:'военный',37:'вестерн'};
let F=[],KEY='',tag='',q='',cur=null,busy=false;const seen=new Set(),R={src:'mine',genre:'',era:'',min:'7'};
const fmt=d=>d?new Date(d).toLocaleDateString('ru-RU'):'';
async function load(){
 try{const r=await fetch('kino-data.json',{cache:'no-cache'});if(r.ok)F=(await r.json()).filter(f=>!f.draft)}catch(e){}
 try{const r=await fetch('kino-config.json',{cache:'no-cache'});if(r.ok)KEY=(await r.json()).tmdbKey||''}catch(e){}
 F.sort((a,b)=>(b.watched||b.date||'').localeCompare(a.watched||a.date||''));
}
const tm=async(path,par=[])=>{const r=await fetch(`https://api.themoviedb.org/3${path}?api_key=${encodeURIComponent(KEY)}&language=ru-RU&${par.join('&')}`);if(!r.ok)throw new Error(r.status===401?'Ключ TMDB не подходит':'TMDB недоступен ('+r.status+')');return r.json()};
const norm=d=>({tmdb:d.id,title:d.title,orig:d.original_title,year:(d.release_date||'').slice(0,4),runtime:d.runtime||0,genres:(d.genres||[]).map(g=>g.name),director:((d.credits&&d.credits.crew)||[]).filter(c=>c.job==='Director').map(c=>c.name).join(', '),overview:d.overview||'',poster:d.poster_path||'',tmdbRating:+(d.vote_average||0).toFixed(1)});
const rate=n=>`<span class="rt" aria-label="Оценка ${n} из 5">${Array.from({length:10},(_,i)=>`<i class="${i<n*2?'on':''}"></i>`).join('')}<b>${n}/5</b></span>`;
const poster=(f,s)=>f.poster?`<img loading="lazy" src="${IMG}${s}${f.poster}" alt="${esc(f.title)}">`:`<span class="np">${esc(f.title)}</span>`;
const card=f=>`<a class="fc" href="#/film/${f.tmdb}"><span class="pw">${poster(f,'w342')}</span><span class="cap"><b>${esc(f.title)}</b>${esc(f.year)} · ${f.rating}/5</span></a>`;
const hit=f=>{const t=q.trim().toLowerCase();return !t||[f.title,f.orig,f.director,f.review,(f.genres||[]).join(' ')].join(' ').toLowerCase().includes(t)};
const filt=()=>F.filter(f=>(!tag||(f.genres||[]).includes(tag))&&hit(f));

const V={};
V.home=()=>`<section class="hero"><h1>Кино</h1><p>Фильмы, которые мы смотрим, и что мы о них думаем. Не знаешь, что включить вечером, — жми кнопку.</p><a class="btn big" href="#/random"><span>Что посмотреть</span><span>↗</span></a></section>
${F.length?`<section class="rec"><div class="row rh"><span>Свежие обзоры</span><a href="#/reviews">Все обзоры ↗</a></div><div class="fg">${F.slice(0,6).map(card).join('')}</div></section>`:`<div class="empty"><h2>Обзоров пока нет</h2><p>Первый обзор можно добавить в админке: найти фильм, поставить оценку и написать текст.</p></div>`}`;
V.reviews=()=>{const g=[...new Set(F.flatMap(f=>f.genres||[]))];
 return `<div class="sec"><div><small>Мои оценки</small><h1>Обзоры</h1></div><span class="row">${F.length} фильмов</span></div><div class="srch"><input id="q" type="search" placeholder="Поиск: фильм, режиссёр, жанр, текст" value="${esc(q)}" aria-label="Поиск"></div>
 ${g.length?`<div class="chips"><button class="chip ${tag?'':'on'}" data-tag="">Все</button>${g.map(x=>`<button class="chip ${tag===x?'on':''}" data-tag="${esc(x)}">${esc(x)}</button>`).join('')}</div>`:''}<div id="res">${res()}</div>`};
const res=()=>{const l=filt();return l.length?`<div class="fg">${l.map(card).join('')}</div>`:`<div class="empty"><h2>${F.length?'Ничего не найдено':'Пока пусто'}</h2><p>${F.length?'Попробуй другой запрос или сбрось жанр.':'Обзоры появятся здесь после первой публикации.'}</p></div>`};
V.film=id=>{const f=F.find(x=>String(x.tmdb)===id);if(!f)return `<div class="empty"><h2>Фильм не найден</h2><p>Возможно, обзор удалили. <a class="lnk" href="#/reviews">Все обзоры</a></p></div>`;
 const rev=esc(f.review||'').split(/\n{2,}/).filter(Boolean).map(b=>b.startsWith('## ')?`<h2>${b.slice(3)}</h2>`:`<p>${b.replace(/\n/g,'<br>')}</p>`).join('');
 return `<article class="film"><div class="poster">${f.poster?`<img src="${IMG}w500${f.poster}" alt="${esc(f.title)}">`:`<div class="np">${esc(f.title)}</div>`}</div><div>
 <a class="lnk" href="#/reviews">← Все обзоры</a><h1>${esc(f.title)}</h1>
 <div class="meta">${[f.orig&&f.orig!==f.title?esc(f.orig):'',esc(f.year),f.director?'реж. '+esc(f.director):'',f.runtime?f.runtime+' мин':'',(f.genres||[]).map(esc).join(', ')].filter(Boolean).join(' · ')}</div>
 <div style="margin-top:16px">${rate(f.rating)}${f.watched?` <span class="meta" style="margin-left:14px">Смотрели ${fmt(f.watched)}</span>`:''}</div>
 ${rev?`<div class="lbl">Обзор</div><div class="rev">${rev}</div>`:''}
 ${f.overview?`<div class="lbl">О фильме</div><div class="about">${esc(f.overview)}</div>`:''}
 <div class="links"><a class="lnk" href="https://letterboxd.com/tmdb/${f.tmdb}/" target="_blank" rel="noopener">Letterboxd ↗</a><a class="lnk" href="https://www.themoviedb.org/movie/${f.tmdb}" target="_blank" rel="noopener">TMDB ↗</a></div></div></article>`};
const filters=()=>`<div class="flt"><select id="fg" aria-label="Жанр"><option value="">Любой жанр</option>${Object.entries(GEN).map(([k,v])=>`<option value="${k}" ${R.genre==k?'selected':''}>${v}</option>`).join('')}</select>
 <select id="fe" aria-label="Эпоха">${[['','Любые годы'],['1900-1969','до 1970'],['1970-1979','70-е'],['1980-1989','80-е'],['1990-1999','90-е'],['2000-2009','2000-е'],['2010-2019','2010-е'],['2020-2030','2020-е']].map(([v,l])=>`<option value="${v}" ${R.era===v?'selected':''}>${l}</option>`).join('')}</select>
 <select id="fm" aria-label="Минимальный рейтинг">${[['6','рейтинг 6+'],['7','рейтинг 7+'],['8','рейтинг 8+']].map(([v,l])=>`<option value="${v}" ${R.min===v?'selected':''}>${l}</option>`).join('')}</select></div>`;
const pickHTML=f=>{const mine=F.find(x=>x.tmdb===f.tmdb);return `<article class="film pick"><div class="poster">${f.poster?`<img src="${IMG}w500${f.poster}" alt="${esc(f.title)}">`:`<div class="np">${esc(f.title)}</div>`}</div><div>
 <div class="lbl" style="margin-top:0">${mine?'Из наших обзоров':'Сегодня вечером'}</div><h1>${esc(f.title)}</h1>
 <div class="meta">${[f.orig&&f.orig!==f.title?esc(f.orig):'',esc(f.year),f.director?'реж. '+esc(f.director):'',f.runtime?f.runtime+' мин':'',(f.genres||[]).map(esc).join(', '),f.tmdbRating?'TMDB '+f.tmdbRating:''].filter(Boolean).join(' · ')}</div>
 ${mine?`<div style="margin-top:14px">${rate(mine.rating)}</div>`:''}
 ${f.overview?`<div class="about" style="margin-top:20px">${esc(f.overview)}</div>`:''}
 <div class="links">${mine?`<a class="btn" href="#/film/${f.tmdb}"><span>Читать обзор</span><span>↗</span></a>`:''}<a class="btn gh" href="https://letterboxd.com/tmdb/${f.tmdb}/" target="_blank" rel="noopener"><span>Letterboxd</span><span>↗</span></a></div></div></article>`};
V.random=()=>`<div class="sec"><div><small>Рулетка</small><h1>Что посмотреть</h1></div></div>
 <div class="ctl"><div class="seg"><button data-src="mine" class="${R.src==='mine'?'on':''}">Из наших обзоров</button><button data-src="world" class="${R.src==='world'?'on':''}" ${KEY?'':'disabled title="Нужен ключ TMDB"'}>Из всего кино</button></div>${R.src==='world'?filters():''}<button class="btn big" id="go"><span>Показать фильм</span><span>↗</span></button></div>
 ${!KEY?'<p class="note">Режим «Из всего кино» выключен: нужен ключ TMDB. Его включают в админке (Кино → «Включить случайный выбор из всего кино»).</p>':''}<div id="pick">${cur?pickHTML(cur):''}</div>`;
async function pickWorld(){
 const p=['sort_by=popularity.desc','vote_count.gte=300','vote_average.gte='+R.min,'include_adult=false'];
 if(R.genre)p.push('with_genres='+R.genre);
 if(R.era){const[a,b]=R.era.split('-');p.push(`primary_release_date.gte=${a}-01-01`,`primary_release_date.lte=${b}-12-31`)}
 const first=await tm('/discover/movie',p.concat('page=1')),pages=Math.min(first.total_pages||1,25),watched=new Set(F.map(f=>f.tmdb));
 for(let round=0;round<2;round++){
  for(let n=0;n<4;n++){                                   // несколько случайных страниц подряд
   const pg=1+Math.floor(Math.random()*pages),r=pg===1?first:await tm('/discover/movie',p.concat('page='+pg));
   const pool=r.results.filter(m=>m.poster_path&&!watched.has(m.id)&&!seen.has(m.id));
   if(pool.length){const m=pool[Math.floor(Math.random()*pool.length)];seen.add(m.id);return norm(await tm('/movie/'+m.id,['append_to_response=credits']))}
  }
  seen.clear();                                           // всё уже показывали — начинаем круг заново
 }
 return null;
}
async function go(){
 if(busy)return;busy=true;const b=$('#go');b.disabled=true;const out=$('#pick');
 try{let f=null;
  if(R.src==='mine'){const pool=F.filter(x=>!cur||x.tmdb!==cur.tmdb);f=pool.length?pool[Math.floor(Math.random()*pool.length)]:F[0]||null}
  else f=await pickWorld();
  if(!f){out.innerHTML='<p class="note">'+(R.src==='mine'?'В обзорах пока нет фильмов.':'По этим фильтрам ничего не нашлось — попробуй мягче.')+'</p>'}
  else{cur=f;out.innerHTML=pickHTML(f)}
 }catch(e){out.innerHTML=`<p class="note">${esc(e.message||'Не получилось загрузить фильм')}</p>`}
 busy=false;b.disabled=false;
}
function render(){
 const [r,a]=(location.hash.replace(/^#\/?/,'')||'home').split('/');
 document.querySelectorAll('nav a[data-r]').forEach(x=>x.classList.toggle('on',x.dataset.r===(r==='film'?'reviews':r)));
 $('#app').innerHTML=(V[r]||V.home)(a);
 document.title=(r==='film'&&F.find(f=>String(f.tmdb)===a)?.title||'КИНО')+' — Т.О 37.ЛАБ';
}
addEventListener('hashchange',()=>{tag='';q='';render();scrollTo(0,0)});
document.addEventListener('click',e=>{
 let x;
 if(x=e.target.closest('.chip')){tag=x.dataset.tag;return render()}
