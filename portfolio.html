<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#000000">
  <title>Портфолио — СВЕМА ЛАБ</title>
  <style>
    :root{--black:#000;--paper:#e5e3dd;--white:#fff;--blue:#0a4aa8;--line:#2e2e2e;--muted:#9ca1a8;--mono:Consolas,"Courier New",monospace;--display:Arial Black,Impact,Arial,sans-serif}*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;background:var(--black);color:var(--white);font-family:Arial,sans-serif}a{color:inherit;text-decoration:none}.page{height:100dvh;min-height:520px;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:68px 1fr 48px}.page:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent calc(100% - 1px),#2e2e2e calc(100% - 1px));background-size:calc(100% / 12) 100%;opacity:.5}.head,.footer{z-index:1;grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,3vw,48px);border-bottom:1px solid var(--line);font:10px var(--mono);letter-spacing:.1em}.head__brand{font:900 14px var(--display);letter-spacing:.07em}.back{display:flex;align-items:center;gap:10px}.back:before{content:"←";font-size:18px}.main{z-index:1;grid-column:2/span 10;display:grid;grid-template-columns:1fr minmax(230px,.65fr);gap:clamp(20px,5vw,82px);align-items:center}.title{margin:0;font:900 clamp(60px,11vw,165px)/.72 var(--display);letter-spacing:-.085em;text-transform:uppercase}.title span{display:block;margin-left:clamp(30px,9vw,140px);color:var(--blue)}.copy{max-width:430px;margin:26px 0 0;color:var(--muted);font:10px/1.8 var(--mono);letter-spacing:.1em}.copy b{color:var(--paper)}.frame{position:relative;min-height:300px;border:1px solid var(--paper);background:var(--paper);color:var(--black);display:flex;flex-direction:column;justify-content:space-between;padding:20px;overflow:hidden}.frame:before{content:"";position:absolute;right:-22%;bottom:-18%;width:75%;aspect-ratio:1;border:1px solid var(--black);transform:rotate(45deg)}.frame__index,.frame__note{position:relative;z-index:1;font:10px var(--mono);letter-spacing:.09em}.frame__note{max-width:185px;font:900 clamp(29px,4vw,52px)/.79 var(--display);letter-spacing:-.055em;text-transform:uppercase}.frame__blue{position:absolute;top:22%;right:17%;width:26%;height:36%;background:var(--blue);animation:rise 5s ease-in-out infinite alternate}.footer{border-top:1px solid var(--line);border-bottom:0;color:var(--muted);font-size:9px}@keyframes rise{100%{transform:translateY(-50px)}}@media(max-width:680px){.page{grid-template-columns:repeat(4,1fr);grid-template-rows:50px 1fr 36px}.head,.footer{padding:0 13px;font-size:8px}.head__brand{font-size:11px}.main{grid-column:1/-1;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:26px;padding:0 16px}.title{font-size:clamp(58px,20vw,100px)}.title span{margin-left:17vw}.copy{margin-top:18px;font-size:8px}.frame{min-height:130px;padding:12px}.frame__index{font-size:7px}.frame__note{font-size:30px}.frame__blue{width:22%;height:45%}}
  </style>
</head>
<body>
  <div class="page">
    <header class="head"><a class="back" href="index.html">К ИНДЕКСУ</a><span class="head__brand">СВЕМА ЛАБ</span></header>
    <main class="main"><section><h1 class="title">МОЁ <span>ПОРТФОЛИО</span></h1><p class="copy"><b>АРХИВ ОТКРЫТ.</b> ФОТОГРАФИИ ПОЯВЯТСЯ ЗДЕСЬ ПОСЛЕ ДОБАВЛЕНИЯ АВТОРОМ.</p></section><section class="frame"><span class="frame__index">03 / АВТОР</span><span class="frame__blue"></span><strong class="frame__note">МЕСТО<br>ДЛЯ КАДРА</strong></section></main>
    <footer class="footer"><span>ПОРТФОЛИО / 2026</span><span>СВЕМА ЛАБ</span></footer>
  </div>
</body>
</html>
